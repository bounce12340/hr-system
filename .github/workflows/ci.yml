name: CI

on:
  push:
    branches: [master, 'improve/**', 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.21.0']
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck client, Worker, tests and tooling
        run: npm run typecheck
      - name: Test with isolated local D1
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Compile Pages Functions
        run: npm run wrangler:check
